<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Agenda - Cadastro</title>
  <link rel="manifest" href="manifest.json">

<body>
  <header>
    <h1>Agenda</h1>
    <nav>
      <a href="index.html" class="ativo">Cadastrar</a>
      <a href="contatos.html">Contatos</a>
    </nav>
  </header>
  <main>
    <h2>Novo contato</h2>
<form id="form-contato">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Maria Silva" required>
      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" placeholder="(48) 99999-9999" required>
      <button type="submit">Salvar</button>
    </form>
    <p id="mensagem" role="status"></p>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/cadastro.js"></script>
  <script src="js/pwa.js"></script>
